[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-v100-plus"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["sglang", "sglang-kernel", "pytest", "scikit-build-core", "cmake>=3.26", "setuptools-rust>=1.11", "setuptools-scm>=8", "wheel", "decord==0.6.0", "greenlet==3.5.6"]

[project.entry-points."sglang.srt.plugins"]
v100_plus = "sglang_v100_plus:register"
v100_memory = "sglang_v100_plus.memory:register"

[tool.setuptools.packages.find]
where = ["v100_plus"]
include = ["sglang_v100_plus*"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# CUDA 13-only acceleration packages are unused by the SM70 serving paths.
exclude-dependencies = ["flash-attn-4", "humming-kernels", "nvshmem4py-cu13", "sgl-deep-ep", "sgl-deep-gemm", "tokenspeed-mla", "nvidia-mathdx", "cuda-tile", "torchaudio", "torchcodec"]
override-dependencies = ["sglang-kernel==0.4.9+v100", "cuda-python>=12.9.4,<13","torch @ https://download.pytorch.org/whl/cu126/torch-2.13.0%2Bcu126-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=8695f3c6b7966d44560275b90c5c28e5091ba33ddbb1ab33b2173782ca1e9145", "flashinfer-python==0.6.18", "nvidia-cutlass-dsl==4.6.2", "torchvision @ https://download.pytorch.org/whl/cu126/torchvision-0.28.0%2Bcu126-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=9afeeea3ec8fdf1d62b473bb13d5bd2dae3dc4d902afa0106f40b0ae5eb48e7b"]
no-build-isolation-package = ["sglang", "sglang-kernel"]

[tool.uv.sources]
sglang = { path = "python", editable = true }
sglang-kernel = { path = "v100_plus/aot" }

[tool.setuptools.package-data]
sglang_v100_plus = ["kernels/csrc/*.cu", "kernels/csrc/*.cpp", "kernels/csrc/elementwise/*.cuh"]
